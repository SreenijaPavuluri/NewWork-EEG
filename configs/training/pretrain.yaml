# STELLA pretraining configuration (CPU-feasible)
name: pretrain

seed: 42
n_epochs: 50
batch_size: 32
grad_accumulation: 2    # effective batch = 64
lr: 1.0e-3
weight_decay: 1.0e-4
val_frac: 0.1
patience: 15
sfreq: 160.0

# Loss weights (ablate by setting to 0.0)
loss:
  lambda_contrastive: 1.0
  lambda_auxiliary: 0.5
  lambda_consistency: 0.3
  lambda_alignment: 0.1
  temperature: 0.07
  subject_weight: 0.5

# Augmentation probabilities
augmentation:
  p_temporal_jitter: 0.5
  p_gaussian_noise: 0.5
  p_amplitude_scale: 0.5
  p_frequency_mask: 0.3
  p_temporal_mask: 0.3
  p_channel_dropout: 0.3
  p_spectral_perturb: 0.3
  noise_std: 0.1
  scale_range: [0.7, 1.3]
  max_jitter_sec: 0.1
  mask_ratio: 0.1
  freq_mask_width_hz: 3.0
  channel_drop_prob: 0.15
